name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-pages.yml
      - dashboard-rebuild/**
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: dashboard-rebuild

    steps:
      - name: Checkout deploy paths
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          sparse-checkout: |
            dashboard-rebuild

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler pages deploy dist --project-name=covidparks --branch=${{ github.ref_name }} --commit-dirty=true
